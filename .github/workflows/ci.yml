name: Publish Application on GitHub Pages
on:
  push:
    branches:
      - main
  pull_request:

# Allow only one run at a time per branch or pull request
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Cancel outdated pull request runs when new commits are pushed (except main).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Build job
  build:
    name: Build Kotlin/Wasm
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up JDK
      uses: actions/setup-java@v6
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v6

    - name: Build and run tests
      run: ./gradlew build

    - name: Build distribution
      run: ./gradlew :webApp:wasmJsBrowserDistribution

    - name: Fix permissions
      run: |
        chmod -v -R +rX "webApp/build/dist/wasmJs/productionExecutable/" | while read line; do
          echo "::warning title=Invalid file permissions automatically fixed::$line"
        done

    - name: Upload Pages artifact
      uses: actions/upload-pages-artifact@v5
      with:
        path: webApp/build/dist/wasmJs/productionExecutable/

  deploy:
    # Add a dependency to the build job
    needs: build
    # Only deploy from main, not from pull requests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    # Grant GITHUB_TOKEN the permissions required to make a Pages deployment
    permissions:
      pages: write      # to deploy to Pages
      id-token: write   # to verify the deployment originates from an appropriate source

    # Deploy to the github-pages environment
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    # Specify runner + deployment step
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
